<svg xmlns="http://www.w3.org/2000/svg" data-theme="paper" viewBox="0 0 760 745" role="img" aria-labelledby="title desc"><title id="title">04 / 餐小参：把状态转成下一步行动</title><desc id="desc">复盘整理。箭头表示关系或流程。</desc><style>[data-theme="paper"]{--bg:#f5f3ec;--fg:#24362f;--muted:#58645e;--line:#c5cec4;--surface:#fffef9;--accent:#28614d;--accent-soft:#e5eee4} text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:22px} .small{font-size:18px;fill:var(--muted)} .label{font-weight:600} .line{fill:none;stroke:var(--accent);stroke-width:2} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--accent)"/></marker></defs><rect width="760" height="745" fill="var(--bg)"/><text x="32" y="42" class="label" text-anchor="start">04 / 餐小参：把状态转成下一步行动</text><text x="32" y="723" class="small" text-anchor="start">设计流程 · 复盘整理</text><rect x="90" y="85" width="580" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="380.0" y="119.5" class="label" text-anchor="middle">明确服务对象</text><text x="380.0" y="149.5" class="small" text-anchor="middle">本人 / 成员 / 家庭共餐</text><polyline points="380,170 380,215" class="line" marker-end="url(#arrow)"/><rect x="90" y="215" width="580" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="380.0" y="249.5" class="label" text-anchor="middle">读取信息与状态</text><text x="380.0" y="279.5" class="small" text-anchor="middle">档案 · 当前方案 · 服务进度</text><polyline points="380,300 380,345" class="line" marker-end="url(#arrow)"/><rect x="90" y="345" width="580" height="85" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="380.0" y="379.5" class="label" text-anchor="middle">组织一个当前重点</text><text x="380.0" y="409.5" class="small" text-anchor="middle">补资料 / 理解并确认方案 / 衔接专业服务</text><polyline points="380,430 380,475" class="line" marker-end="url(#arrow)"/><rect x="90" y="475" width="580" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="380.0" y="509.5" class="label" text-anchor="middle">用户行动后更新状态</text><text x="380.0" y="539.5" class="small" text-anchor="middle">继续同一条饮食服务主线</text><polyline points="670,517 705,517 705,257 670,257" class="line" marker-end="url(#arrow)"/><text x="380" y="628" class="small" text-anchor="middle">规则限定可做什么 · AI 辅助理解与表达</text><text x="380" y="665" class="small" text-anchor="middle">用户保留关键确认权，行动后继续更新状态</text></svg>