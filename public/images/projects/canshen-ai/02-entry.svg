<svg xmlns="http://www.w3.org/2000/svg" data-theme="paper" viewBox="0 0 760 680" role="img" aria-labelledby="title desc"><title id="title">02 / 入口合并：减少选择，不删健康需求</title><desc id="desc">复盘整理。箭头表示关系或流程。</desc><style>[data-theme="paper"]{--bg:#f5f3ec;--fg:#24362f;--muted:#58645e;--line:#c5cec4;--surface:#fffef9;--accent:#28614d;--accent-soft:#e5eee4} text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:22px} .small{font-size:18px;fill:var(--muted)} .label{font-weight:600} .line{fill:none;stroke:var(--accent);stroke-width:2} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--accent)"/></marker></defs><rect width="760" height="680" fill="var(--bg)"/><text x="32" y="42" class="label" text-anchor="start">02 / 入口合并：减少选择，不删健康需求</text><text x="32" y="658" class="small" text-anchor="start">复盘整理</text><text x="195" y="100" class="label" text-anchor="middle">此前：多个饮食定制入口</text><text x="565" y="100" class="label" text-anchor="middle">1.5：一个综合定制入口</text><rect x="35" y="130" width="310" height="75" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="190.0" y="174.5" class="label" text-anchor="middle">体质调理</text><rect x="35" y="235" width="310" height="75" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="190.0" y="279.5" class="label" text-anchor="middle">慢病膳食</text><rect x="35" y="340" width="310" height="75" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="190.0" y="384.5" class="label" text-anchor="middle">其他饮食定制类别</text><text x="190" y="453" class="small" text-anchor="middle">原五六个入口的类别概括</text><rect x="415" y="130" width="310" height="90" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="570.0" y="167.0" class="label" text-anchor="middle">统一饮食定制</text><text x="570.0" y="197.0" class="small" text-anchor="middle">不要求用户先选单一标签</text><polyline points="345,273 380,273 380,175 415,175" class="line" marker-end="url(#arrow)"/><polyline points="345,167 380,167" class="line"/><polyline points="345,377 380,377 380,273" class="line"/><rect x="415" y="280" width="310" height="160" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="570.0" y="337.0" class="label" text-anchor="middle">同一份方案综合考虑</text><text x="570.0" y="367.0" class="small" text-anchor="middle">慢病 · 体质</text><text x="570.0" y="397.0" class="small" text-anchor="middle">饮食偏好 · 饮食目标</text><polyline points="570,220 570,280" class="line" marker-end="url(#arrow)"/><rect x="70" y="520" width="620" height="80" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="380.0" y="552.0" class="label" text-anchor="middle">健康绝对兜底</text><text x="380.0" y="582.0" class="small" text-anchor="middle">偏好与目标在健康约束内满足</text><polyline points="570,440 570,520" class="line" marker-end="url(#arrow)"/></svg>