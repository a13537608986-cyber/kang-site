<svg xmlns="http://www.w3.org/2000/svg" data-theme="paper" viewBox="0 0 760 610" role="img" aria-labelledby="title desc"><title id="title">01 / 重构总览：让各模块服务同一份方案</title><desc id="desc">复盘整理。箭头表示关系或流程。</desc><style>[data-theme="paper"]{--bg:#f5f3ec;--fg:#24362f;--muted:#58645e;--line:#c5cec4;--surface:#fffef9;--accent:#28614d;--accent-soft:#e5eee4} text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:22px} .small{font-size:18px;fill:var(--muted)} .label{font-weight:600} .line{fill:none;stroke:var(--accent);stroke-width:2} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--accent)"/></marker></defs><rect width="760" height="610" fill="var(--bg)"/><text x="32" y="42" class="label" text-anchor="start">01 / 重构总览：让各模块服务同一份方案</text><text x="32" y="588" class="small" text-anchor="start">复盘整理</text><rect x="205" y="85" width="350" height="85" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="380.0" y="119.5" class="label" text-anchor="middle">综合饮食方案</text><text x="380.0" y="149.5" class="small" text-anchor="middle">从分散入口走向统一判断</text><rect x="30" y="245" width="330" height="105" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="195.0" y="274.5" class="label" text-anchor="middle">范围取舍</text><text x="195.0" y="304.5" class="small" text-anchor="middle">删除旅行支持、宴请场景</text><text x="195.0" y="334.5" class="small" text-anchor="middle">合并入口，暂缓其他服务</text><rect x="400" y="245" width="330" height="105" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="565.0" y="274.5" class="label" text-anchor="middle">健康约束</text><text x="565.0" y="304.5" class="small" text-anchor="middle">生成前获得综合信息</text><text x="565.0" y="334.5" class="small" text-anchor="middle">必填健康资料缺失则补齐</text><rect x="30" y="420" width="330" height="105" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="195.0" y="449.5" class="label" text-anchor="middle">餐小参 Agent</text><text x="195.0" y="479.5" class="small" text-anchor="middle">明确对象与当前状态</text><text x="195.0" y="509.5" class="small" text-anchor="middle">组织下一步行动</text><rect x="400" y="420" width="330" height="105" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="565.0" y="449.5" class="label" text-anchor="middle">营养师服务</text><text x="565.0" y="479.5" class="small" text-anchor="middle">审核 / 调整并解释</text><text x="565.0" y="509.5" class="small" text-anchor="middle">用户采用后接回日常计划</text><polyline points="380,170 380,205 195,205 195,245" class="line" marker-end="url(#arrow)"/><polyline points="380,205 565,205 565,245" class="line" marker-end="url(#arrow)"/><polyline points="380,205 380,390 195,390 195,420" class="line" marker-end="url(#arrow)"/><polyline points="380,390 565,390 565,420" class="line" marker-end="url(#arrow)"/></svg>