<svg xmlns="http://www.w3.org/2000/svg" data-theme="paper" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc"><title id="title">05 / 营养师双端：交付之后，还要采用</title><desc id="desc">复盘整理。箭头表示关系或流程。</desc><style>[data-theme="paper"]{--bg:#f5f3ec;--fg:#24362f;--muted:#58645e;--line:#c5cec4;--surface:#fffef9;--accent:#28614d;--accent-soft:#e5eee4} text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:22px} .small{font-size:18px;fill:var(--muted)} .label{font-weight:600} .line{fill:none;stroke:var(--accent);stroke-width:2} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--accent)"/></marker></defs><rect width="760" height="1040" fill="var(--bg)"/><text x="32" y="42" class="label" text-anchor="start">05 / 营养师双端：交付之后，还要采用</text><text x="32" y="1018" class="small" text-anchor="start">设计流程 · 复盘整理</text><rect x="35" y="78" width="320" height="60" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="195.0" y="115.0" class="label" text-anchor="middle">用户端</text><rect x="405" y="78" width="320" height="60" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="565.0" y="115.0" class="label" text-anchor="middle">营养师端</text><path d="M380 155 V880" stroke="var(--line)" stroke-dasharray="7 7"/><rect x="35" y="165" width="320" height="90" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="195.0" y="202.0" class="label" text-anchor="middle">购买服务</text><text x="195.0" y="232.0" class="small" text-anchor="middle">复用已有资料，补充本次问题</text><rect x="405" y="165" width="320" height="90" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="565.0" y="202.0" class="label" text-anchor="middle">接单</text><text x="565.0" y="232.0" class="small" text-anchor="middle">围绕同一对象与方案服务</text><polyline points="355,210 405,210" class="line" marker-end="url(#arrow)"/><rect x="405" y="320" width="320" height="110" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="565.0" y="352.0" class="label" text-anchor="middle">审核当前方案</text><text x="565.0" y="382.0" class="small" text-anchor="middle">可保留，也可提出调优</text><text x="565.0" y="412.0" class="small" text-anchor="middle">均需给结论并解释原因</text><polyline points="565,255 565,320" class="line" marker-end="url(#arrow)"/><rect x="405" y="495" width="320" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="565.0" y="529.5" class="label" text-anchor="middle">确认交付</text><text x="565.0" y="559.5" class="small" text-anchor="middle">进入待用户确认</text><polyline points="565,430 565,495" class="line" marker-end="url(#arrow)"/><rect x="35" y="495" width="320" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="195.0" y="529.5" class="label" text-anchor="middle">查看结论与安排</text><text x="195.0" y="559.5" class="small" text-anchor="middle">理解保留或调整的理由</text><polyline points="405,537 355,537" class="line" marker-end="url(#arrow)"/><rect x="35" y="680" width="320" height="90" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="195.0" y="717.0" class="label" text-anchor="middle">用户确认采用</text><text x="195.0" y="747.0" class="small" text-anchor="middle">交付不等于自动执行</text><polyline points="195,580 195,680" class="line" marker-end="url(#arrow)"/><polyline points="355,555 380,555 380,365 405,365" class="line" marker-end="url(#arrow)"/><text x="195" y="386" class="small" text-anchor="middle">需要反馈时</text><text x="195" y="416" class="small" text-anchor="middle">返回审核与交付</text><rect x="80" y="860" width="600" height="85" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="380.0" y="894.5" class="label" text-anchor="middle">采用后同步日常计划</text><text x="380.0" y="924.5" class="small" text-anchor="middle">回到原有执行链路，不另起一套计划</text><polyline points="195,770 195,860" class="line" marker-end="url(#arrow)"/><text x="565" y="724" class="small" text-anchor="middle">订单完成 ≠ 方案采用</text><text x="565" y="757" class="small" text-anchor="middle">未采用不自动进入执行</text></svg>