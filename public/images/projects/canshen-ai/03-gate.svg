<svg xmlns="http://www.w3.org/2000/svg" data-theme="paper" viewBox="0 0 760 840" role="img" aria-labelledby="title desc"><title id="title">03 / 生成门槛：先有依据，再给方案</title><desc id="desc">复盘整理。箭头表示关系或流程。</desc><style>[data-theme="paper"]{--bg:#f5f3ec;--fg:#24362f;--muted:#58645e;--line:#c5cec4;--surface:#fffef9;--accent:#28614d;--accent-soft:#e5eee4} text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:22px} .small{font-size:18px;fill:var(--muted)} .label{font-weight:600} .line{fill:none;stroke:var(--accent);stroke-width:2} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--accent)"/></marker></defs><rect width="760" height="840" fill="var(--bg)"/><text x="32" y="42" class="label" text-anchor="start">03 / 生成门槛：先有依据，再给方案</text><text x="32" y="818" class="small" text-anchor="start">复盘整理</text><rect x="175" y="85" width="410" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="380.0" y="119.5" class="label" text-anchor="middle">获得用户综合信息</text><text x="380.0" y="149.5" class="small" text-anchor="middle">健康情况 · 饮食偏好 · 饮食目标</text><rect x="175" y="225" width="410" height="75" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="380.0" y="269.5" class="label" text-anchor="middle">必填健康资料是否完整？</text><polyline points="380,170 380,225" class="line" marker-end="url(#arrow)"/><rect x="40" y="385" width="290" height="85" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="185.0" y="419.5" class="label" text-anchor="middle">引导补齐缺失资料</text><text x="185.0" y="449.5" class="small" text-anchor="middle">此时不能生成方案</text><rect x="430" y="385" width="290" height="85" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="575.0" y="419.5" class="label" text-anchor="middle">进入综合判断</text><text x="575.0" y="449.5" class="small" text-anchor="middle">健康绝对兜底</text><polyline points="260,300 260,345 185,345 185,385" class="line" marker-end="url(#arrow)"/><text x="175" y="332" class="small" text-anchor="start">不完整</text><polyline points="500,300 500,345 575,345 575,385" class="line" marker-end="url(#arrow)"/><text x="575" y="332" class="small" text-anchor="start">完整</text><polyline points="40,427 20,427 20,262 175,262" class="line" marker-end="url(#arrow)"/><text x="40" y="244" class="small" text-anchor="start">补齐后复核</text><rect x="430" y="535" width="290" height="90" rx="10" fill="var(--accent-soft)" stroke="var(--line)"/><text x="575.0" y="572.0" class="label" text-anchor="middle">形成综合饮食方案</text><text x="575.0" y="602.0" class="small" text-anchor="middle">不是多份单项菜单拼接</text><polyline points="575,470 575,535" class="line" marker-end="url(#arrow)"/><rect x="60" y="690" width="640" height="80" rx="10" fill="var(--surface)" stroke="var(--line)"/><text x="380.0" y="722.0" class="label" text-anchor="middle">信息完整是进入综合判断的必要条件</text><text x="380.0" y="752.0" class="small" text-anchor="middle">后续判断仍需遵循专业规则</text></svg>